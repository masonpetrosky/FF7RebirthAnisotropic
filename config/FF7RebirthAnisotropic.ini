[Anisotropic]
; Anisotropic filtering level for the game's texture samplers, which ask for 4x: 2, 4, 8 or 16 (any of 1-16 works).
; Samplers the game creates at 1x keep it. 0 = leave the game's samplers alone. The game creates its samplers when it
; starts, so this applies at startup.
MaxAnisotropy=16
